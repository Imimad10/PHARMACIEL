<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Hors-Ligne - PHARMACIEL</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        h1 {
            color: #ef4444;
        }
        p {
            color: #a0aec0;
            max-width: 400px;
        }
        .btn {
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #166fe5;
        }
    </style>
</head>
<body>
    <div class="icon">📡❌</div>
    <h1>Vous êtes hors-ligne</h1>
    <p>La connexion au serveur a été perdue. Veuillez vérifier votre connexion internet ou le réseau Wi-Fi du dépôt.</p>
    <a href="/" class="btn">Réessayer la connexion</a>
</body>
</html>
